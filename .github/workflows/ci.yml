name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Browser installieren (WebKit wie in der Companion App)
        run: pnpm exec playwright install --with-deps webkit
      - name: Browser-Tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ergebnisse
          path: e2e/test-results
          retention-days: 7

  # main baut die normale App (ha-stups-{arch}), beta baut die Beta-App (ha-stups-beta-{arch}): nie die Bilder der jeweils anderen
  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Kanal und Version bestimmen
        id: version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            channel=beta; config=stups-beta/config.yaml; image=ha-stups-beta
          else
            channel=stable; config=stups/config.yaml; image=ha-stups
          fi
          version=$(grep '^version:' "$config" | tr -d '\"' | awk '{print $2}')
          # Schutz: Eine Beta-Version trägt „-beta.", eine normale nie ein „-". Sonst würde das falsche Bild unter dem falschen Namen veröffentlicht.
          case "$channel:$version" in
            beta:*-beta.[0-9]*) ;;
            stable:*-*) echo "::error::Die Version der normalen App darf kein Suffix haben: $version"; exit 1 ;;
            stable:[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Unerwartete Version für $channel: $version"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stups/Dockerfile
          build-args: |
            STUPS_CHANNEL=${{ steps.version.outputs.channel }}
            STUPS_VERSION=${{ steps.version.outputs.value }}
          push: true
          # verknüpft das Paket mit dem Repository (Sichtbarkeit und Rechte kommen von dort)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.version.outputs.image }}-${{ matrix.arch }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.version.outputs.image }}-${{ matrix.arch }}:latest

  # Ein Name für beide Architekturen, für Docker ohne Home Assistant (docker compose, Synology):
  # ghcr.io/<owner>/stups:<version> und :latest. Das Add-on nutzt weiter die Bilder mit Architektur im Namen.
  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version aus config.yaml lesen
        id: version
        run: echo "value=$(grep '^version:' stups/config.yaml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest für amd64 und aarch64 anlegen
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "ghcr.io/${OWNER}/stups:${VERSION}" \
            -t "ghcr.io/${OWNER}/stups:latest" \
            "ghcr.io/${OWNER}/ha-stups-amd64:${VERSION}" \
            "ghcr.io/${OWNER}/ha-stups-aarch64:${VERSION}"
