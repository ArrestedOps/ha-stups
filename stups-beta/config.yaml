name: "Stups (Beta)"
version: "1.11.0-beta.1"
slug: stups_beta
description: "Beta-Version von Stups mit eigenen Daten, zum Testen neuer Versionen vor der Veröffentlichung"
url: https://github.com/ArrestedOps/ha-stups
arch:
  - aarch64
  - amd64
image: ghcr.io/arrestedops/ha-stups-beta-{arch}
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:flask-outline
panel_title: Stups Beta
panel_admin: false
homeassistant_api: true
map:
  - share:rw
options:
  users: []
  access_mode: selected
  dashboard_path: /
  daily_summary_time: "08:00"
  overdue_nag_time: "18:00"
  log_level: info
schema:
  users:
    - name: str
      notify:
        - str
  access_mode: list(everyone|selected)
  dashboard_path: str
  daily_summary_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  overdue_nag_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  log_level: list(debug|info|warn|error)
