name: Stups
version: "1.25.1"
slug: stups
description: "Kanban-Board mit Push-Erinnerungen: ein Stups, wenn etwas fällig ist"
url: https://github.com/ArrestedOps/ha-stups
arch:
  - aarch64
  - amd64
image: ghcr.io/arrestedops/ha-stups-{arch}
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:view-column
panel_title: Stups
panel_admin: false
homeassistant_api: true
map:
  - share:rw
options:
  users: []
  access_mode: selected
  dashboard_path: /
  daily_summary_time: "08:00"
  overdue_nag_time: "18:00"
  log_level: info
schema:
  users:
    - name: str
      notify:
        - str
  access_mode: list(everyone|selected)
  dashboard_path: str
  daily_summary_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  overdue_nag_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  log_level: list(debug|info|warn|error)
