name: CI

on:
  push:
    branches: [main, beta, release]
  pull_request:

permissions:
  contents: read

# Pro Branch läuft nur ein Durchlauf: Zwei Veröffentlichungen desselben Kanals schreiben dieselben Tags (:latest, die Version) und dürften sich nie
# überholen. Auf Branches wird nichts abgebrochen (ein laufendes Veröffentlichen wird zu Ende geführt, ein weiterer Push wartet); nur bei
# Pull Requests verdrängt ein neuer Stand den alten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Das Gebaute starten, nicht nur den Quellcode prüfen: Gesundheit, Anmeldung, schreiben, neu starten, Daten noch da
      - name: Smoke-Test des gebauten Servers
        run: node e2e/smoke.mjs --local

  # Die Browser-Tests dauern am längsten und laufen in vier Gruppen gleichzeitig (jede mit eigenen Servern und Datenbanken):
  # Handy dunkel, Handy hell, Kernabläufe in Chromium und Firefox und alle übrigen Projekte (Desktop, Wächter, Einrichtung …).
  # Jede Gruppe braucht einige Minuten. Neue Projekte in e2e/playwright.config.ts gehören in eine der Gruppen („projects“) und ihr Browser
  # in „browsers“, sonst laufen sie nirgends (das prüft der Schritt „Alle Projekte abgedeckt“). Die Gruppe „browser“ hat einen eigenen Server,
  # weil die Specs nicht für zwei Projekte auf demselben Bestand gebaut sind.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dunkel
            projects: dunkel
            browsers: webkit
          - name: hell
            projects: hell
            browsers: webkit
          - name: browser
            projects: chromium-handy firefox-desktop
            browsers: chromium firefox
          - name: rest
            projects: desktop-dunkel desktop-hell desktop-ha english waechter standalone standalone-ha optionen onboarding-dark onboarding-light onboarding-desktop-dark onboarding-desktop-light beta
            browsers: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Browser installieren (WebKit wie die iPhone-Companion-App, Chromium wie die Android-App, dazu Firefox)
        run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      - name: Alle Projekte abgedeckt
        if: matrix.name == 'rest'
        run: |
          # Jedes Projekt der Konfiguration muss in einer Gruppe dieser Datei stehen, sonst bliebe es unbemerkt ungetestet.
          all=$(grep -oE "name: '[a-z-]+'" e2e/playwright.config.ts | sed -E "s/name: '(.*)'/\1/" | sort -u)
          mine=$(grep -E '^[[:space:]]+projects:' .github/workflows/ci.yml | sed -E 's/^[[:space:]]+projects:[[:space:]]*//' | tr '\n' ' ')
          missing=""
          for p in $all; do case " $mine " in *" $p "*) ;; *) missing="$missing $p" ;; esac; done
          if [ -n "$missing" ]; then echo "::error::Projekte ohne Gruppe in ci.yml:$missing"; exit 1; fi
      - name: Browser-Tests
        run: |
          args=""
          for p in ${{ matrix.projects }}; do args="$args --project=$p"; done
          pnpm e2e $args
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ergebnisse-${{ matrix.name }}
          path: e2e/test-results
          retention-days: 7

  # release baut die normale App (ha-stups-{arch}), beta baut die Beta-App (ha-stups-beta-{arch}): nie die Bilder der jeweils anderen.
  # Wichtig: Home Assistant sieht eine neue Version, sobald sie in `main` liegt. Darum wird `main` erst am Ende von
  # `release` (Job `promote`) nachgezogen, wenn die Bilder fertig sind. So gibt es kein „manifest unknown“ mehr.
  image:
    needs: [test, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/beta')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Kanal und Version bestimmen
        id: version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            channel=beta; config=stups-beta/config.yaml; image=ha-stups-beta
          else
            channel=stable; config=stups/config.yaml; image=ha-stups
          fi
          version=$(grep '^version:' "$config" | tr -d '\"' | awk '{print $2}')
          # Schutz: Eine Beta-Version trägt „-beta.", eine normale nie ein „-". Sonst würde das falsche Bild unter dem falschen Namen veröffentlicht.
          case "$channel:$version" in
            beta:*-beta.[0-9]*) ;;
            stable:*-*) echo "::error::Die Version der normalen App darf kein Suffix haben: $version"; exit 1 ;;
            stable:[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Unerwartete Version für $channel: $version"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Erst bauen und ins lokale Docker laden, das fertige Image starten und prüfen (je Architektur auf einem Runner dieser Architektur),
      # dann erst veröffentlichen. Der Cache sorgt dafür, dass das Veröffentlichen nicht noch einmal von vorn baut.
      - name: Image bauen (lokal, zum Prüfen)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stups/Dockerfile
          build-args: |
            STUPS_CHANNEL=${{ steps.version.outputs.channel }}
            STUPS_VERSION=${{ steps.version.outputs.value }}
          load: true
          push: false
          tags: stups-smoke:ci
          cache-from: type=gha,scope=image-${{ steps.version.outputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ steps.version.outputs.image }}-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke-Test des Images (starten, anmelden, schreiben, neu starten, Daten noch da)
        run: node e2e/smoke.mjs --image stups-smoke:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stups/Dockerfile
          build-args: |
            STUPS_CHANNEL=${{ steps.version.outputs.channel }}
            STUPS_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=image-${{ steps.version.outputs.image }}-${{ matrix.arch }}
          push: true
          # verknüpft das Paket mit dem Repository (Sichtbarkeit und Rechte kommen von dort)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.version.outputs.image }}-${{ matrix.arch }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ steps.version.outputs.image }}-${{ matrix.arch }}:latest

  # Ein Name für beide Architekturen, für Docker ohne Home Assistant (docker compose, Synology):
  # ghcr.io/<owner>/stups:<version> und :latest. Das Add-on nutzt weiter die Bilder mit Architektur im Namen.
  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version aus config.yaml lesen
        id: version
        run: echo "value=$(grep '^version:' stups/config.yaml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest für amd64 und aarch64 anlegen
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "ghcr.io/${OWNER}/stups:${VERSION}" \
            -t "ghcr.io/${OWNER}/stups:latest" \
            "ghcr.io/${OWNER}/ha-stups-amd64:${VERSION}" \
            "ghcr.io/${OWNER}/ha-stups-aarch64:${VERSION}"

  # Erst jetzt sind beide Bilder und das Manifest da: `main` auf diesen Stand setzen, damit Home Assistant das Update anzeigt.
  # Nur vorwärts (fast-forward); schlägt es fehl, ist `main` weitergelaufen und es wird nichts überschrieben.
  promote:
    needs: manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main nachziehen
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
