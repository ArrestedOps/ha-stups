<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stups · Idee 2 · Stapel</title>
<!--
  Mockup, kein Produktcode. Eine Aufgabe nach der anderen: die oberste Karte ist das, was jetzt dran ist.
  Wischen nach rechts: erledigt. Nach links: später. Die Farbe der Karte sagt, wie dringend es ist.
  Parameter: ?theme=light|dark. Nur Handy.
-->
<style>
@font-face { font-family: "Familjen Grotesk"; src: url("../fonts/familjen-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
:root {
  --bg: #e5e8ec; --ink: #000000; --mute: #50565f; --line: #c9ced6; --paper: #ffffff;
  --c1: #ff5a36; --c2: #ff9a7a; --c3: #ffd23f;     /* überfällig · bald · diese Woche */
  --btn: #000000; --on-btn: #ffffff; --bar: rgba(229,232,236,.92);
  --font: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --mute: #a0a5ad; --line: #2b2d31; --paper: #1c1c1f; --btn: #ffffff; --on-btn: #000000; --bar: rgba(0,0,0,.9); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --mute: #a0a5ad; --line: #2b2d31; --paper: #1c1c1f; --btn: #ffffff; --on-btn: #000000; --bar: rgba(0,0,0,.9); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font: 500 17px/1.3 var(--font); -webkit-font-smoothing: antialiased; max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 12px; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; padding: var(--s3) var(--s4) var(--s2); }
.wordmark { font: 700 26px/1 var(--font); letter-spacing: -0.02em; }
.wordmark i { font-style: normal; color: var(--c1); }
.right { display: flex; align-items: center; gap: var(--s2); }
.iconbtn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); }
.iconbtn .pip { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--c1); }
.me { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--btn); color: var(--on-btn); font: 700 17px/1 var(--font); }

.nudge { display: flex; align-items: center; gap: var(--s2); white-space: nowrap; text-align: left; margin: var(--s2) var(--s4) 0; padding: 6px var(--s4) 6px 6px; border-radius: 999px; background: var(--paper); font-size: 15px; }
.nudge .a { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: #fff; font: 700 13px/1 var(--font); }
.nudge b { font-weight: 700; }
.nudge .go { margin-left: auto; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.prog { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s4) var(--s3); }
.prog .segs { display: flex; gap: 6px; flex: 1; }
.prog .segs i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.prog .segs i.d { background: var(--ink); } .prog .segs i.n { background: var(--c1); }
.prog .t { font-size: 15px; color: var(--mute); white-space: nowrap; }

.stage { position: relative; flex: 1; min-height: 0; margin: 0 var(--s4); }
.card { position: absolute; left: 0; right: 0; border-radius: 32px; padding: var(--s5); color: #000; display: flex; flex-direction: column; }
.card.k3 { top: 26px; bottom: 0; left: 30px; right: 30px; background: var(--c3); }
.card.k2 { top: 14px; bottom: 16px; left: 15px; right: 15px; background: var(--c2); }
.card.k1 { top: 0; bottom: 32px; background: var(--c1); }
.card .row1 { display: flex; align-items: center; gap: var(--s2); }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--s3); border-radius: 16px; background: #000; color: #fff; font: 600 14px/1 var(--font); }
.tag.o { background: rgba(0,0,0,.12); color: #000; }
.tag svg { width: 15px; height: 15px; }
.card h2 { margin-top: auto; font: 700 52px/0.96 var(--font); letter-spacing: -0.03em; text-wrap: balance; }
.card .when { margin-top: var(--s3); font: 500 19px/1.25 var(--font); }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s4); font-size: 16px; font-weight: 600; }
.card .who { display: inline-flex; align-items: center; gap: var(--s2); }
.card .who .a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #000; color: #fff; font: 700 15px/1 var(--font); }
.hint { display: flex; justify-content: space-between; margin: 0 var(--s5); padding: var(--s2) 0 0; font-size: 13px; color: var(--mute); }

.actions { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s4); padding: var(--s4) var(--s5) var(--s3); }
.actions button { display: grid; place-items: center; gap: 4px; justify-self: center; font: 600 13px/1 var(--font); color: var(--mute); }
.actions .r { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--ink); color: var(--ink); }
.actions .big { width: 80px; height: 80px; border: 0; background: var(--btn); color: var(--on-btn); }
.actions .big svg { width: 38px; height: 38px; stroke-width: 2.6; }
.actions .big + span { color: var(--ink); }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bar); border-top: 1px solid var(--line); padding: var(--s1) 0 max(var(--s2), env(safe-area-inset-bottom)); }
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 6px 0 2px; font: 600 12px/1.2 var(--font); color: var(--mute); }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { stroke-width: 2.6; }
.tabbar svg { width: 25px; height: 25px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.7L12 13 3.5 8.2 12 3.5Z"/><path d="m3.5 12.6 8.5 4.8 8.5-4.8"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19.5 6.5v5.6c0 4.2-3 7.4-7.5 8.4-4.5-1-7.5-4.2-7.5-8.4V6.5L12 3.5Z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H18l-3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H6l3 3"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4h11l-2.2 4 2.2 4h-11"/></symbol>
  </defs>
</svg>

<header class="top">
  <span class="wordmark">stups<i>.</i></span>
  <div class="right"><button class="iconbtn" aria-label="Mitteilungen, 1 neue"><svg><use href="#i-bell"/></svg><span class="pip"></span></button><button class="me" aria-label="Konto: Anna">A</button></div>
</header>

<button class="nudge" style="width:calc(100% - 32px)"><span class="a">B</span><span><b>Ben</b> stupst dich: Fenster putzen</span><span class="go">Ansehen</span></button>

<div class="prog">
  <div class="segs" role="img" aria-label="1 von 3 erledigt"><i class="d"></i><i class="n"></i><i></i></div>
  <span class="t num">1 von 3 erledigt</span>
</div>

<main class="stage" aria-label="Aufgabenstapel">
  <article class="card k3" aria-label="Danach: Fenster putzen"></article>
  <article class="card k2" aria-label="Danach: Paket abholen"></article>
  <article class="card k1">
    <div class="row1"><span class="tag num">überfällig seit 1 Std. 25 Min.</span></div>
    <div class="row1" style="margin-top:8px"><span class="tag o"><svg><use href="#i-flag"/></svg>Hoch</span><span class="tag o"><svg><use href="#i-repeat"/></svg>jede Woche</span></div>
    <h2>Müll rausbringen</h2>
    <div class="when num">heute, 16:17</div>
    <div class="foot"><span class="who"><span class="a">A</span>Anna</span><span>Haushalt</span></div>
  </article>
</main>
<div class="hint"><span>← später</span><span>erledigt →</span></div>

<div class="actions">
  <button><span class="r"><svg><use href="#i-clock"/></svg></span>Später</button>
  <span style="display:grid;justify-items:center;gap:4px"><button class="r big" aria-label="Erledigt"><svg><use href="#i-check"/></svg></button><span style="font:700 13px var(--font)">Erledigt</span></span>
  <button><span class="r"><svg><use href="#i-more"/></svg></span>Mehr</button>
</div>

<nav class="tabbar" aria-label="Hauptbereiche">
  <button aria-current="page"><svg><use href="#i-tasks"/></svg>Aufgaben</button>
  <button><svg><use href="#i-layers"/></svg>Boards</button>
  <button><svg><use href="#i-shield"/></svg>Wächter</button>
</nav>
<script>try { var t = new URLSearchParams(location.search).get('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</body>
</html>
