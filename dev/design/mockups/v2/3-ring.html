<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stups · Idee 3 · Ring</title>
<!--
  Mockup, kein Produktcode. Der Tag als Ring, den der Haushalt gemeinsam füllt.
  Jedes Stück hat die Farbe der Person, die es erledigt hat. Offene Stücke sind leer. Keine Rangliste, nur: Wir sind dabei.
  Parameter: ?theme=light|dark. Nur Handy.
-->
<style>
@font-face { font-family: "Albert Sans"; src: url("../fonts/albert-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f3f4f6; --card: #ffffff; --ink: #000000; --mute: #5d636e; --line: #e3e5ea; --track: #e3e5ea;
  --anna: #e8590c; --ben: #2563eb; --mia: #c2185b; --accent: #c2410c; --on-accent: #ffffff;
  --bar: rgba(255,255,255,.92);
  --font: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --card: #1b1b1e; --ink: #fff; --mute: #a3a8b1; --line: #2a2b2f; --track: #2a2b30; --anna: #ff7a33; --ben: #6e9bff; --mia: #ff5c9a; --accent: #ff8a50; --on-accent: #1a0b02; --bar: rgba(27,27,30,.92); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000; --card: #1b1b1e; --ink: #fff; --mute: #a3a8b1; --line: #2a2b2f; --track: #2a2b30; --anna: #ff7a33; --ben: #6e9bff; --mia: #ff5c9a; --accent: #ff8a50; --on-accent: #1a0b02; --bar: rgba(27,27,30,.92); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.35 var(--font); -webkit-font-smoothing: antialiased; max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; padding: var(--s3) var(--s4) 0; }
.wordmark { font: 800 24px/1 var(--font); letter-spacing: -0.03em; }
.wordmark i { font-style: normal; color: var(--accent); }
.right { display: flex; gap: var(--s2); align-items: center; }
.iconbtn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--card); }
.iconbtn .pip { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.me { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--anna); color: #fff; font: 700 17px/1 var(--font); }

.hero { display: grid; justify-items: center; padding: var(--s3) var(--s4) 0; }
.ring { position: relative; width: 232px; height: 232px; }
.ring svg { width: 232px; height: 232px; transform: rotate(-90deg); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font: 800 76px/0.9 var(--font); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.ring .big small { font: 600 26px/1 var(--font); color: var(--mute); letter-spacing: 0; }
.ring .cap { margin-top: 6px; font-size: 15px; color: var(--mute); }
.say { margin-top: var(--s3); text-align: center; font: 600 19px/1.3 var(--font); max-width: 17em; text-wrap: balance; }
.say b { color: var(--accent); font-weight: 700; }
.legend { display: flex; gap: var(--s4); margin-top: var(--s3); font-size: 14px; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; }

.nudge { display: flex; align-items: center; gap: var(--s3); margin: var(--s4) var(--s4) 0; padding: var(--s3) var(--s4); border-radius: 18px; background: var(--card); width: calc(100% - 32px); }
.nudge .a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ben); color: #fff; font: 700 14px/1 var(--font); flex: none; }
.nudge .t { flex: 1; display: grid; }
.nudge b { font-weight: 700; }
.nudge .t span { color: var(--mute); font-size: 14px; }
.nudge .go { height: 32px; padding: 0 var(--s3); border-radius: 16px; background: var(--ink); color: var(--bg); font: 700 14px/32px var(--font); }

.list { flex: 1; min-height: 0; overflow: hidden; padding: var(--s4) var(--s4) 0; }
.gh { display: flex; align-items: baseline; justify-content: space-between; padding: var(--s2) var(--s1) var(--s2); font: 700 17px/1.2 var(--font); }
.gh span { font: 500 14px/1 var(--font); color: var(--mute); }
.item { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s1); border-top: 1px solid var(--line); }
.item .c { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--mute); flex: none; }
.item .n { font: 600 17px/1.2 var(--font); }
.item .m { display: flex; gap: var(--s2); align-items: center; font-size: 14px; color: var(--mute); }
.item .m svg { width: 14px; height: 14px; }
.item .m .late { color: var(--accent); font-weight: 700; }
.item .g { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--anna); color: #fff; font: 700 12px/1 var(--font); }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bar); border-top: 1px solid var(--line); padding: var(--s1) 0 max(var(--s2), env(safe-area-inset-bottom)); }
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 6px 0 2px; font: 600 11.5px/1.2 var(--font); color: var(--mute); }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar svg { width: 25px; height: 25px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.7L12 13 3.5 8.2 12 3.5Z"/><path d="m3.5 12.6 8.5 4.8 8.5-4.8"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19.5 6.5v5.6c0 4.2-3 7.4-7.5 8.4-4.5-1-7.5-4.2-7.5-8.4V6.5L12 3.5Z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H18l-3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H6l3 3"/></symbol>
  </defs>
</svg>

<header class="top">
  <span class="wordmark">stups<i>.</i></span>
  <div class="right"><button class="iconbtn" aria-label="Mitteilungen, 1 neue"><svg><use href="#i-bell"/></svg><span class="pip"></span></button><button class="me" aria-label="Konto: Anna">A</button></div>
</header>

<section class="hero" aria-label="Heute im Haushalt">
  <div class="ring" role="img" aria-label="3 von 5 Aufgaben heute erledigt: eine von Anna, eine von Ben, eine von Mia, zwei offen">
    <svg viewBox="0 0 232 232">
      <!-- fünf Stücke, Umfang 2π·96 ≈ 603; je Stück 109 lang, 10 Lücke -->
      <circle cx="116" cy="116" r="96" fill="none" stroke="var(--anna)" stroke-width="22" stroke-linecap="round" stroke-dasharray="88.6 514.5" stroke-dashoffset="-11.0"/>
      <circle cx="116" cy="116" r="96" fill="none" stroke="var(--ben)" stroke-width="22" stroke-linecap="round" stroke-dasharray="88.6 514.5" stroke-dashoffset="-131.6"/>
      <circle cx="116" cy="116" r="96" fill="none" stroke="var(--mia)" stroke-width="22" stroke-linecap="round" stroke-dasharray="88.6 514.5" stroke-dashoffset="-252.3"/>
      <circle cx="116" cy="116" r="96" fill="none" stroke="var(--track)" stroke-width="22" stroke-linecap="round" stroke-dasharray="88.6 514.5" stroke-dashoffset="-372.9"/>
      <circle cx="116" cy="116" r="96" fill="none" stroke="var(--track)" stroke-width="22" stroke-linecap="round" stroke-dasharray="88.6 514.5" stroke-dashoffset="-493.5"/>
    </svg>
    <div class="mid"><div class="big">3<small> von 5</small></div><div class="cap">heute erledigt</div></div>
  </div>
  <p class="say">Zusammen läuft es gut. <b>Zwei Dinge</b> sind noch offen.</p>
  <div class="legend"><span><i style="background:var(--anna)"></i>Anna</span><span><i style="background:var(--ben)"></i>Ben</span><span><i style="background:var(--mia)"></i>Mia</span><span><i style="background:var(--track)"></i>offen</span></div>
</section>

<button class="nudge"><span class="a">B</span><span class="t"><b>Ben stupst dich</b><span>Fenster putzen</span></span><span class="go">Ansehen</span></button>

<main class="list">
  <div class="gh">Deine Aufgaben <span class="num">3 offen</span></div>
  <div class="item"><span class="c"></span><div><div class="n">Müll rausbringen</div><div class="m"><span class="late num">überfällig seit 16:17</span><svg><use href="#i-repeat"/></svg></div></div><span class="g">A</span></div>
  <div class="item"><span class="c"></span><div><div class="n">Paket abholen</div><div class="m"><span class="late num">überfällig seit 16:30</span></div></div><span class="g">A</span></div>
  <div class="item"><span class="c"></span><div><div class="n">Fenster putzen</div><div class="m"><span class="num">morgen 10:00, mit Ben</span></div></div><span class="g">A</span></div>
</main>

<nav class="tabbar" aria-label="Hauptbereiche">
  <button aria-current="page"><svg><use href="#i-tasks"/></svg>Aufgaben</button>
  <button><svg><use href="#i-layers"/></svg>Boards</button>
  <button><svg><use href="#i-shield"/></svg>Wächter</button>
</nav>
<script>try { var t = new URLSearchParams(location.search).get('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</body>
</html>
