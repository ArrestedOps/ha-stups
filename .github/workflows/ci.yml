name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Browser installieren (WebKit wie in der Companion App)
        run: pnpm exec playwright install --with-deps webkit
      - name: Browser-Tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ergebnisse
          path: e2e/test-results
          retention-days: 7

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version aus config.yaml lesen
        id: version
        run: echo "value=$(grep '^version:' stups/config.yaml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stups/Dockerfile
          push: true
          # verknüpft das Paket mit dem Repository (Sichtbarkeit und Rechte kommen von dort)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/ha-stups-${{ matrix.arch }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/ha-stups-${{ matrix.arch }}:latest

  # Ein Name für beide Architekturen, für Docker ohne Home Assistant (docker compose, Synology):
  # ghcr.io/<owner>/stups:<version> und :latest. Das Add-on nutzt weiter die Bilder mit Architektur im Namen.
  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version aus config.yaml lesen
        id: version
        run: echo "value=$(grep '^version:' stups/config.yaml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Owner kleinschreiben
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest für amd64 und aarch64 anlegen
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "ghcr.io/${OWNER}/stups:${VERSION}" \
            -t "ghcr.io/${OWNER}/stups:latest" \
            "ghcr.io/${OWNER}/ha-stups-amd64:${VERSION}" \
            "ghcr.io/${OWNER}/ha-stups-aarch64:${VERSION}"
