configuration:
  users:
    name: Personen und Push-Geräte (veraltet)
    description: >-
      Gilt nur beim ersten Start nach dem Update: Dann übernimmt Stups die Personen und ihre Notify-Dienste (ohne
      "notify.") in die App. Danach pflegst du das in der App unter Einstellungen › Personen & Zugriff; Änderungen
      hier haben keine Wirkung mehr.
  access_mode:
    name: Zugriff (veraltet)
    description: >-
      Gilt nur beim ersten Start nach dem Update (und nur, wenn oben Personen eingetragen sind). Danach stellst du
      den Zugriff in der App unter Einstellungen › Personen & Zugriff ein.
  dashboard_path:
    name: Dashboard-Pfad (veraltet)
    description: >-
      Gilt nur beim ersten Start nach dem Update. Danach wählst du das Ziel des Zurück-Buttons in der App unter
      Einstellungen › Dashboard.
  daily_summary_time:
    name: Uhrzeit der täglichen Zusammenfassung (veraltet)
    description: >-
      Gilt nur beim ersten Start nach dem Update. Danach stellst du die Uhrzeit in der App unter Einstellungen ›
      Tageszusammenfassung ein (Format HH:MM).
  overdue_nag_time:
    name: Uhrzeit für das Nachhaken bei Überfälligkeit (veraltet)
    description: >-
      Gilt nur beim ersten Start nach dem Update. Danach stellst du die Uhrzeit in der App unter Einstellungen ›
      Nachhaken um … ein (Format HH:MM).
  log_level:
    name: Log-Level
    description: Detailgrad der Protokolle im Add-on-Log.
