<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stups iOS</title>
<!--
  Mockup, kein Produktcode. Stups im Stil von iOS: Systemschrift, großer Titel, gruppierte Listen, Wischaktionen, Blätter, Pull-down-Menü, Banner.
  Bedienbar: Haken antippen, Zeile nach rechts wischen (erledigt) oder links (Später, Löschen), Zeile antippen (Details als Blatt), Kachel antippen (neue Seite),
  Symbol oben rechts (Personen), "Neue Aufgabe" (Schnelleingabe erkennt Datum, Person, Board). Nach einigen Sekunden kommt ein Stups als Banner von oben.
  Am Computer (ab 900 px) als Split-Ansicht. Parameter: ?theme=light|dark. Respektiert "Bewegung reduzieren".
-->
<style>
@font-face { font-family: "Inter"; src: url("../fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f2f2f7; --card: #ffffff; --label: #000000; --label2: #6c6c70; --label3: #aeaeb2; --sep: #d6d6da; --fill: #e9e9ee;
  --tint: #d14a00; --tint-fill: #f05400; --tint-soft: rgba(209, 74, 0, .12);
  --red: #d1261c; --red-fill: #ff3b30; --blue-fill: #0a7aff; --green-fill: #34c759; --orange-fill: #ff9500; --gray-fill: #8e8e93;
  --mat: rgba(249, 249, 249, .8); --scrim: rgba(0, 0, 0, .32); --shadow: 0 10px 30px rgba(0, 0, 0, .16);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, "Inter", system-ui, sans-serif;
  --spring: cubic-bezier(.32, .72, 0, 1); --dur: 1;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --card: #1c1c1e; --label: #fff; --label2: #98989f; --label3: #636366; --sep: #38383a; --fill: #2c2c2e; --tint: #ff8a3d; --tint-soft: rgba(255, 138, 61, .18); --red: #ff6961; --red-fill: #ff453a; --blue-fill: #0a84ff; --green-fill: #30d158; --orange-fill: #ff9f0a; --mat: rgba(30, 30, 30, .78); --scrim: rgba(0, 0, 0, .5); --shadow: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #000; --card: #1c1c1e; --label: #fff; --label2: #98989f; --label3: #636366; --sep: #38383a; --fill: #2c2c2e; --tint: #ff8a3d; --tint-soft: rgba(255, 138, 61, .18); --red: #ff6961; --red-fill: #ff453a; --blue-fill: #0a84ff; --green-fill: #30d158; --orange-fill: #ff9f0a; --mat: rgba(30, 30, 30, .78); --scrim: rgba(0, 0, 0, .5); --shadow: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark; }
@media (prefers-reduced-motion: reduce) { :root { --dur: 0; } }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font: 400 17px/1.29 var(--font); letter-spacing: -0.022em; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 10px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Rahmen ---------- */
.stage { height: 100%; display: grid; place-items: center; }
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
@media (min-width: 560px) and (max-width: 899px) { .stage { background: var(--fill); } .app { width: 400px; height: min(860px, 100%); border-radius: 44px; box-shadow: 0 0 0 10px #0d0d0f, var(--shadow); } }
.root { position: absolute; inset: 0; background: var(--bg); transition: transform calc(.5s * var(--dur)) var(--spring), border-radius calc(.5s * var(--dur)) var(--spring); transform-origin: 50% 100%; overflow: hidden; }
.root.back { transform: scale(.925) translateY(calc(var(--sat) + 6px)); border-radius: 14px; }
.screens { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; background: var(--bg); transition: transform calc(.42s * var(--dur)) var(--spring); will-change: transform; }
.screen.under { transform: translateX(-28%); } .screen.enter { transform: translateX(100%); }
.screen.under::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .12); pointer-events: none; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-top: calc(var(--sat) + 44px); padding-bottom: calc(160px + var(--sab)); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { display: none; }

/* ---------- Navigationsleiste ---------- */
.nav { position: absolute; left: 0; right: 0; top: 0; z-index: 20; height: calc(var(--sat) + 44px); padding-top: var(--sat); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: 8px; }
.nav::before { content: ""; position: absolute; inset: 0; background: var(--mat); backdrop-filter: blur(22px) saturate(1.8); -webkit-backdrop-filter: blur(22px) saturate(1.8); border-bottom: .5px solid var(--sep); opacity: var(--p, 0); }
.nav > * { position: relative; }
.nav .it { font: 600 17px/1 var(--font); opacity: var(--p, 0); white-space: nowrap; }
.nav .l { justify-self: start; } .nav .r { justify-self: end; display: flex; gap: 6px; }
.nbtn { display: inline-grid; place-items: center; min-width: 44px; height: 44px; color: var(--tint); border-radius: 22px; }
.nbtn.back { display: inline-flex; align-items: center; gap: 2px; padding-right: 8px; font-size: 17px; }
.nbtn.back svg { width: 14px; height: 24px; stroke-width: 2.6; }
.nbtn.circ { width: 34px; min-width: 34px; height: 34px; margin: 5px 6px; background: var(--fill); }
.nbtn.circ svg { width: 20px; height: 20px; }
.nbtn .pip { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--tint-fill); border: 2px solid var(--bg); box-sizing: content-box; }

.large { padding: 4px 16px 0; }
.large h1 { font: 700 34px/1.12 var(--font); letter-spacing: .012em; transform-origin: 0 100%; }
.large .sub { margin-top: 2px; font-size: 15px; color: var(--label2); letter-spacing: -0.01em; }
.search { display: flex; align-items: center; gap: 6px; margin: 10px 16px 0; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--fill); color: var(--label2); font-size: 17px; }
.search svg { width: 17px; height: 17px; }

/* ---------- Kacheln ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 16px 0; }
.tile { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 4px 8px; padding: 12px 12px 12px; border-radius: 14px; background: var(--card); text-align: left; transition: transform calc(.25s * var(--dur)) var(--spring); min-height: 74px; }
.tile:active { transform: scale(.97); }
.tile .ic { grid-row: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c); }
.tile .ic svg { width: 19px; height: 19px; stroke-width: 2.2; }
.tile .n { grid-column: 2; justify-self: end; font: 700 32px/1 var(--round); letter-spacing: 0; overflow: hidden; height: 32px; }
.tile .l { grid-column: 1 / -1; font: 600 15px/1.1 var(--font); color: var(--label2); letter-spacing: -0.01em; }
.roll { display: inline-block; position: relative; }
.roll.go { animation: roll calc(.35s * var(--dur)) var(--spring); }
@keyframes roll { from { transform: translateY(70%); opacity: 0; } }

/* ---------- Listen ---------- */
.sec { margin-top: 22px; }
.sec h2 { display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px 8px; font: 700 20px/1.15 var(--font); letter-spacing: .01em; }
.sec h2 span { font: 500 15px/1 var(--font); color: var(--label2); }
.sec.late h2 { color: var(--red); } .sec.late h2 span { color: var(--red); }
.group { margin: 0 16px; border-radius: 12px; background: var(--card); overflow: hidden; }
.row { position: relative; overflow: hidden; background: var(--card); }
.row + .row::before { content: ""; position: absolute; left: 54px; right: 0; top: 0; height: .5px; background: var(--sep); z-index: 3; }
.rc { position: relative; z-index: 2; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; background: var(--card); touch-action: pan-y; cursor: pointer; will-change: transform; }
.rc.snap { transition: transform calc(.38s * var(--dur)) var(--spring); }
.cb { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1.75px solid var(--label3); display: grid; place-items: center; transition: background-color calc(.2s * var(--dur)), border-color calc(.2s * var(--dur)); }
.cb::after { content: ""; position: absolute; inset: -9px; }
.cb svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.4; stroke-dasharray: 22; stroke-dashoffset: 22; }
.row.doing .cb { background: var(--tint-fill); border-color: var(--tint-fill); animation: pop calc(.4s * var(--dur)) var(--spring); }
.row.doing .cb svg { stroke-dashoffset: 0; transition: stroke-dashoffset calc(.25s * var(--dur)) ease-out calc(.08s * var(--dur)); }
@keyframes pop { 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.row.doing .t { color: var(--label2); text-decoration: line-through; text-decoration-color: var(--label3); }
.rc .t { font: 400 17px/1.25 var(--font); }
.rc .m { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; margin-top: 1px; font-size: 15px; color: var(--label2); letter-spacing: -0.01em; }
.rc .m svg { width: 14px; height: 14px; }
.rc .m span { display: inline-flex; align-items: center; gap: 3px; }
.rc .m .od { color: var(--red); }
.rc .m .hi { color: var(--tint); font-weight: 600; }
.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c, #8e8e93); color: #fff; font: 600 12px/1 var(--font); letter-spacing: 0; box-shadow: 0 0 0 2px var(--card); }
.avs { display: inline-flex; } .avs .av + .av { margin-left: -8px; }
.act { position: absolute; top: 0; bottom: 0; display: flex; z-index: 1; visibility: hidden; }
.row.sw .act { visibility: visible; }
.act.lead { left: 0; width: 0; overflow: hidden; background: var(--green-fill); } .act.trail { right: 0; }
.act button { display: grid; place-items: center; align-content: center; gap: 3px; width: 82px; color: #fff; font: 500 13px/1 var(--font); letter-spacing: 0; }
.act.lead button { width: 100%; justify-items: start; padding-left: 26px; }
.act.trail .later { background: var(--blue-fill); } .act.trail .del { background: var(--red-fill); }
.act svg { width: 22px; height: 22px; }
.row.collapse { transition: height calc(.32s * var(--dur)) var(--spring), opacity calc(.2s * var(--dur)); height: 0 !important; opacity: 0; }
.row.fresh .rc { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--tint-soft); } }
.empty { margin: 8px 16px 0; padding: 28px 20px; border-radius: 12px; background: var(--card); text-align: center; color: var(--label2); }
.empty b { display: block; margin-bottom: 4px; color: var(--label); font: 600 17px/1.2 var(--font); }

/* ---------- Tab-Leiste (schwebend, Glas) ---------- */
.tabbar { position: absolute; left: 14px; right: 14px; bottom: calc(10px + var(--sab)); z-index: 30; display: grid; grid-template-columns: 1fr 1fr 70px 1fr 1fr; align-items: center; height: 64px; padding: 0 6px; border-radius: 32px; background: var(--mat); backdrop-filter: blur(28px) saturate(1.9); -webkit-backdrop-filter: blur(28px) saturate(1.9); box-shadow: 0 10px 34px rgba(0, 0, 0, .2), 0 0 0 .5px rgba(60, 60, 67, .22); }
.tbbub { position: absolute; z-index: 1; top: 6px; left: 0; height: 52px; width: 70px; transition: transform calc(.55s * var(--dur)) var(--spring), width calc(.55s * var(--dur)) var(--spring); pointer-events: none; }
.tbbub i { display: block; width: 100%; height: 100%; border-radius: 26px; background: rgba(120, 120, 128, .18); }
.tbbub.go i { animation: stretch calc(.6s * var(--dur)) var(--spring); }
@keyframes stretch { 30% { transform: scale(1.18, .88); } 65% { transform: scale(.97, 1.04); } }
.tb { position: relative; z-index: 2; display: grid; justify-items: center; align-content: center; gap: 2px; height: 52px; padding: 0; font: 500 10px/1.1 var(--font); letter-spacing: 0; color: var(--label2); transition: color calc(.25s * var(--dur)); }
.tb[aria-current="page"] { color: var(--tint); }
.tb svg { width: 25px; height: 25px; transition: transform calc(.45s * var(--dur)) var(--spring); }
.tb[aria-current="page"] svg { transform: scale(1.08); }
.tbplus { position: relative; z-index: 3; justify-self: center; display: grid; place-items: center; width: 54px; height: 36px; border-radius: 18px; background: var(--tint-fill); color: #fff; transition: transform calc(.5s * var(--dur)) var(--spring); }
.tbplus svg { width: 22px; height: 22px; stroke-width: 2.9; transition: transform calc(.55s * var(--dur)) var(--spring); }
.tbplus:active { transform: scale(.92); } .tbplus.open svg { transform: rotate(135deg); }
:root[data-theme="dark"] .tbplus { color: #1a0b02; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tbplus { color: #1a0b02; } }
.fab { display: none; position: absolute; z-index: 29; right: 16px; bottom: calc(66px + var(--sab)); align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; border-radius: 26px; background: var(--tint-fill); color: #fff; font: 600 17px/1 var(--font); box-shadow: 0 8px 24px rgba(240, 84, 0, .38); transition: transform calc(.3s * var(--dur)) var(--spring); }
.fab:active { transform: scale(.95); } .fab svg { width: 24px; height: 24px; stroke-width: 2.6; }
:root[data-theme="dark"] .fab { color: #1a0b02; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab { color: #1a0b02; } }
.tabscreen { z-index: 15; opacity: 0; pointer-events: none; transform: scale(.985); transition: opacity calc(.3s * var(--dur)), transform calc(.45s * var(--dur)) var(--spring); }
.tabscreen.on { opacity: 1; pointer-events: auto; transform: none; }

/* ---------- Kopfzeile: Logo, Zuhause, Mitteilungen, Einstellungen ---------- */
.logo { display: inline-flex; align-items: center; gap: 8px; padding-left: 8px; }
.logo img { width: 30px; height: 30px; border-radius: 7px; display: block; box-shadow: 0 0 0 .5px rgba(60, 60, 67, .25); }
.logo b { font: 800 20px/1 var(--font); letter-spacing: -0.02em; } .logo i { font-style: normal; color: var(--tint-fill); }
.nbtn.ic { position: relative; width: 36px; min-width: 36px; height: 36px; margin: 4px 3px; background: var(--fill); color: var(--label); }
.nbtn.ic svg { width: 20px; height: 20px; } .nbtn.ic.ha { color: var(--ha); background: var(--ha-soft); }
.nbtn .cnt { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red-fill); color: #fff; font: 700 11px/18px var(--font); letter-spacing: 0; text-align: center; box-shadow: 0 0 0 2px var(--bg); animation: cnt calc(.6s * var(--dur)) var(--spring) 1.2s backwards; }
@keyframes cnt { from { transform: scale(0); } }
.subrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; } .subrow .whop { margin-right: auto; }
.whop { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px 0 12px; border-radius: 16px; background: var(--fill); font: 600 15px/1 var(--font); letter-spacing: -0.01em; transition: transform calc(.3s * var(--dur)) var(--spring); }
.whop:active { transform: scale(.96); } .whop svg { width: 11px; height: 14px; stroke-width: 2.6; transform: rotate(90deg); color: var(--label2); }
.sico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; } .sico svg { width: 18px; height: 18px; stroke-width: 2.1; }
.chev { width: 9px; height: 15px; color: var(--label3); stroke-width: 2.6; }
.sw { position: relative; width: 51px; height: 31px; border-radius: 16px; background: rgba(120, 120, 128, .32); flex: none; transition: background-color calc(.3s * var(--dur)); }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform calc(.35s * var(--dur)) var(--spring); }
.sw.on { background: var(--green-fill); } .sw.on::after { transform: translateX(20px); }
.nlist .li { align-items: flex-start; } .nlist .li .k b { display: block; font-weight: 600; } .nlist .li .k span { display: block; color: var(--label2); font-size: 15px; } .nlist .li time { color: var(--label2); font-size: 13px; }
.nlist .li.unread::after { content: ""; position: absolute; left: 4px; top: 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--tint-fill); }

/* ---------- Live-Aufgabe (läuft gerade) ---------- */
.livec { display: grid; gap: 12px; margin: 14px 16px 0; padding: 14px 16px 16px; border-radius: 22px; background: #1c1c1e; color: #fff; overflow: hidden; animation: livein calc(.8s * var(--dur)) var(--spring) backwards; transition: height calc(.45s * var(--dur)) var(--spring), margin calc(.45s * var(--dur)) var(--spring), padding calc(.45s * var(--dur)) var(--spring), opacity calc(.3s * var(--dur)); }
@keyframes livein { from { opacity: 0; transform: translateY(-18px) scale(.94); } }
.livec.gone { height: 0 !important; margin-top: 0; padding-block: 0; opacity: 0; }
.livec .lh { display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--font); color: rgba(255, 255, 255, .64); letter-spacing: 0; }
.livec .lh .who { margin-left: auto; }
.dotp { width: 9px; height: 9px; border-radius: 50%; background: var(--tint-fill); animation: dotp calc(1.4s * var(--dur)) ease-in-out infinite; flex: none; }
@keyframes dotp { 50% { transform: scale(.55); opacity: .45; } }
.livec.paused .dotp { animation: none; background: #8e8e93; }
.livec .lt { font: 600 20px/1.2 var(--font); letter-spacing: -0.015em; }
.livec .lm { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.livec .tm { font: 700 42px/1 var(--round); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.livec .tm small { display: block; margin-top: 6px; font: 500 14px/1 var(--font); color: rgba(255, 255, 255, .6); letter-spacing: -0.01em; }
.livec .ring { position: relative; width: 62px; height: 62px; flex: none; }
.livec .ring svg { width: 62px; height: 62px; stroke-width: 5.5; transform: rotate(-90deg); }
.livec .ring .trk { stroke: rgba(255, 255, 255, .16); } .livec .ring .prg { stroke: var(--tint-fill); stroke-linecap: round; stroke-dasharray: 163.4; transition: stroke-dashoffset calc(.9s * var(--dur)) linear; }
.livec .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 15px/1 var(--round); letter-spacing: 0; }
.livec .lb { display: flex; gap: 8px; }
.livec .lb button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, .15); color: #fff; font: 600 16px/1 var(--font); transition: transform calc(.3s * var(--dur)) var(--spring); }
.livec .lb button:active { transform: scale(.96); } .livec .lb button svg { width: 15px; height: 15px; }
.livec .lb .ok { background: var(--tint-fill); }
:root[data-theme="dark"] .livec { background: #2c2c2e; } :root[data-theme="dark"] .livec .lb .ok { color: #1a0b02; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .livec { background: #2c2c2e; } :root:not([data-theme="light"]) .livec .lb .ok { color: #1a0b02; } }
.lvb { display: inline-flex; align-items: center; gap: 5px; color: var(--tint); font-weight: 600; }
.lvb i { width: 7px; height: 7px; border-radius: 50%; background: var(--tint-fill); animation: dotp calc(1.4s * var(--dur)) ease-in-out infinite; }
body.intro .livec { animation-delay: calc(.35s * var(--dur)); }

/* ---------- Aufgabe: Das Zuhause meldet ---------- */
.house { display: flex; align-items: center; gap: 14px; margin: 14px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--card); overflow: hidden; transition: height calc(.45s * var(--dur)) var(--spring), margin calc(.45s * var(--dur)) var(--spring), padding calc(.45s * var(--dur)) var(--spring), opacity calc(.3s * var(--dur)); }
.house.gone { height: 0 !important; margin-top: 0; padding-block: 0; opacity: 0; }
.house.done { animation: hpop calc(.7s * var(--dur)) var(--spring); }
@keyframes hpop { 30% { transform: scale(1.025); } }
.hring { position: relative; width: 46px; height: 46px; flex: none; }
.hring svg { width: 46px; height: 46px; stroke-width: 4; }
.hring .trk { stroke: var(--fill); } .hring .prg { stroke: var(--blue-fill); stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 40; transform: rotate(-90deg); transform-origin: 22px 22px; transition: stroke-dashoffset calc(8s * var(--dur)) linear, stroke calc(.4s * var(--dur)); }
.hring .hck { stroke: var(--green-fill); stroke-width: 3.6; stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset calc(.5s * var(--dur)) var(--spring) calc(.1s * var(--dur)); }
.house.done .prg { stroke: var(--green-fill); stroke-dashoffset: 0; } .house.done .hck { stroke-dashoffset: 0; }
