configuration:
  users:
    name: People and push devices (deprecated)
    description: >-
      Only applies at the first start after the update: Stups then copies the people and their notify services
      (without "notify.") into the app. After that you manage them in the app under Settings › People & access;
      changes here no longer have any effect.
  access_mode:
    name: Access (deprecated)
    description: >-
      Only applies at the first start after the update (and only if people are entered above). After that you set
      access in the app under Settings › People & access.
  dashboard_path:
    name: Dashboard path (deprecated)
    description: >-
      Only applies at the first start after the update. After that you choose the target of the back button in the
      app under Settings › Dashboard.
  daily_summary_time:
    name: Time of the daily summary (deprecated)
    description: >-
      Only applies at the first start after the update. After that you set the time in the app under Settings ›
      Reminder times (format HH:MM).
  overdue_nag_time:
    name: Time for the overdue follow-up (deprecated)
    description: >-
      Only applies at the first start after the update. After that you set the time in the app under Settings ›
      Reminder times (format HH:MM).
  log_level:
    name: Log level
    description: Level of detail of the logs in the add-on log.
